<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<title>{{ neg.nombre }} · Asistente</title>
<style>
:root{ /* Identidad: blanco y negro del logo. Para sumar un color de marca cambie --acento */
--papel:#f5f5f5;--tinta:#111;--acento:#111;--burbuja:#fff;--linea:#d6d6d6;--logo:none}
@media (prefers-color-scheme:dark){:root{--papel:#0e0e0e;--tinta:#f2f2f2;--acento:#f2f2f2;--burbuja:#1a1a1a;--linea:#333;--logo:invert(1)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 10px;border-bottom:2px solid var(--tinta);display:flex;align-items:center;gap:12px}
.logo{height:42px;width:auto;filter:var(--logo)}
h1{font-size:1.15rem;margin:0;flex:1}h1 small{display:block;font-weight:400;font-size:.75rem;opacity:.7}
button{font:inherit;cursor:pointer}
#nueva{background:none;border:1.5px solid var(--tinta);color:var(--tinta);border-radius:8px;padding:6px 10px;font-size:.85rem}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:var(--burbuja);border:1px solid var(--linea);border-bottom-left-radius:4px;align-self:flex-start}
.yo{background:var(--tinta);color:var(--papel);border-bottom-right-radius:4px;align-self:flex-end}
.fuente{display:block;font-size:.72rem;opacity:.6;margin-top:6px}
.wa{display:inline-block;margin-top:8px;background:#128c4a;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.chips button{background:var(--burbuja);border:1.5px solid var(--tinta);color:var(--tinta);border-radius:99px;padding:5px 11px;font-size:.85rem}
#pensando{padding:0 16px 6px;font-size:.85rem;opacity:.7;min-height:22px}
form{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--linea)}
input{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--linea);background:var(--burbuja);color:var(--tinta)}
form button{background:var(--acento);color:var(--papel);border:0;border-radius:10px;padding:0 16px}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
</style>
</head>
<body>
<main>
<header>
  <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Logo de DaSe Fussion">
  <h1>{{ neg.nombre }}<small>Asistente virtual · v{{ neg.version }}</small></h1>
  <button id="nueva" type="button">Nueva conversación</button>
</header>
<div id="chat" role="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<div id="pensando" aria-live="polite"></div>
<form id="f" autocomplete="off">
  <input id="t" maxlength="400" placeholder="Escribe tu pregunta" aria-label="Tu mensaje">
  <button>Enviar</button>
</form>
</main>
<script>
const SALUDO = {{ neg.saludo|tojson }}, SUG = {{ sugerencias|tojson }};
const chat = document.getElementById('chat'), t = document.getElementById('t'),
      chips = document.getElementById('chips'), pens = document.getElementById('pensando');
let estado = {}, ocupado = false;

function burbuja(texto, clase, fuente, wa) {
  const d = document.createElement('div'); d.className = 'm ' + clase;
  d.append(document.createTextNode(texto));            // textContent: nunca HTML del servidor
  if (fuente) { const s = document.createElement('span'); s.className = 'fuente'; s.textContent = 'Fuente: ' + fuente; d.append(s); }
  if (wa && wa.startsWith('https://wa.me/')) {
    const a = document.createElement('a'); a.className = 'wa'; a.href = wa; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Continuar por WhatsApp'; d.append(a);
  }
  chat.append(d); chat.scrollTop = chat.scrollHeight;
}
function sugerir(lista) {
  chips.replaceChildren(...lista.map(s => { const b = document.createElement('button'); b.type = 'button';
    b.textContent = s; b.onclick = () => enviar(s); return b; }));
}
function reiniciar() { estado = {}; chat.replaceChildren(); burbuja(SALUDO, 'bot'); sugerir(SUG); t.focus(); }

async function enviar(texto) {
  if (ocupado) return;
  if (!texto.trim()) { burbuja('Escribe tu pregunta para que pueda ayudarte.', 'bot'); return; }
  burbuja(texto, 'yo'); t.value = ''; ocupado = true; pens.textContent = 'Escribiendo…';
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mensaje: texto, estado}), signal: ctl.signal});
    const d = await r.json();
    estado = d.estado || {};
    burbuja(d.respuesta, 'bot', d.fuente, d.whatsapp);
    sugerir(d.sugerencias || SUG);
  } catch (e) {
    burbuja('No pude conectarme. Revisa tu internet e intenta de nuevo.', 'bot');
  } finally { clearTimeout(tm); ocupado = false; pens.textContent = ''; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); enviar(t.value); };
document.getElementById('nueva').onclick = reiniciar;
reiniciar();
</script>
</body>
</html>
